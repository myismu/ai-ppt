spring:
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8718
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:a1e2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c}
            group-id: SENTINEL_GROUP
            data-id: gateway-flow-rules
            rule-type: gw-flow
            data-type: json

    gateway:
      # 【核心修复】开启流式响应支持，防止流式数据被网关缓存拦截
      streaming-media-types:
        - text/event-stream
        - application/stream+json

      server:
        webflux:
          routes:
            # ==================== 用户服务路由 ====================
            - id: user-hub-service
              uri: lb://user-hub-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/routes/**,/api/systemInfo/**,/api/login-history/**,/api/password-history/**,/api/redis/**,/api/seata/test/**
              filters:
                - StripPrefix=1 # 去掉前缀

            # ==================== 题库服务路由 ====================
            - id: question-bank-service
              uri: lb://question-bank-service
              predicates:
                - Path=/api/public/**,/api/file/**,/api/admin/**
              filters:
                - StripPrefix=1

            # ==================== AI 服务路由 (新增) ====================
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=1

            # ==================== 静态资源路由 ====================
            - id: static-resources
              uri: lb://question-bank-service
              predicates:
                - Path=/img/**
              filters:
                - name: AddResponseHeader
                  args:
                    name: Cache-Control
                    value: "public, max-age=86400"

          # ==================== 全局跨域配置 ====================
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-wait: 5000
          max-idle: 10
          min-idle: 5

  # ==================== 开发工具配置 ====================
  devtools:
    restart:
      enabled: true

jwt:
  secret: YOUR_JWT_SECRET_HERE
  expiration: 86400000

logging:
  level:
    com.exambaby.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
