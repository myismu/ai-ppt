# =========================================================================
# ai-service.yaml (建议 Data ID: ai-service.yaml, Group: DEFAULT_GROUP)
# =========================================================================

ai:
  # 小米 MIMO / Anthropic 文本接口配置
  xiaomi:
    api-key: "sk-c8gqs6afg0bsp6frkpz0ksq1q2ulk8ars5wvwol86d4bfvhb"
    base-url: "https://api.xiaomimimo.com/anthropic" # 恢复为 .env 原始地址
    anthropic-version: "2023-06-01"
    model: "mimo-v2-flash"

  # 豆包 (火山引擎) 生图接口配置
  doubao:
    api-key: "YOUR_IMAGE_MODEL_API_KEY_HERE"
    base-url: "https://ark.cn-beijing.volces.com/api/v3/images/generations"
    model: "doubao-seedream-5-0-260128"

# Redis 配置 (用于 Token 统计和生图状态追踪)
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

# 日志配置
logging:
  level:
    com.exambaby.ai: DEBUG
    org.springframework.web.reactive.function.client.WebClient: DEBUG
