spring:
  cloud:
    # ==================== Sentinel 熔断限流配置 ====================
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8720
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:a1e2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:a1e2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
            data-type: json

    # ==================== OpenFeign 配置 ====================
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
      circuitbreaker:
        enabled: true

    # ==================== RocketMQ 消息队列配置 ====================
    # ⚠️ 注意：这里是 spring.cloud.function 下
    function:
      definition: defaultIn;onUserRegister # 当有多个消费者时候必须在这里显式定义所有的函数名
    stream:
      function:
        definition: defaultIn;onUserRegister # 使用分号追加多个函数名
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876} # RocketMQ NameServer 地址
      bindings:
        # 默认生产端绑定 (供 StreamBridge 使用)
        default-out-0:
          destination: question-topic
        # 默认消费端绑定 (函数名-in-0)
        defaultIn-in-0:
          destination: question-topic # RocketMQ topic
          group: question-bank-group # RocketMQ 消费组

        # 新增：接收来自【用户中心】的消息
        onUserRegister-in-0:
          destination: user-register-topic # RocketMQ topic
          group: qbank-register-group # RocketMQ 消费组

  # ==================== 数据库相关配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/question_bank?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: YOUR_DB_PASSWORD_HERE

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-wait: 5000
          max-idle: 10
          min-idle: 5

  # ==================== 其他 Spring 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  devtools:
    restart:
      enabled: true

# ==================== Seata 分布式事务配置 ====================
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: exam-bank-tx-group
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      exam-bank-tx-group: default
  # 注册中心设为 file，表示不走 Nacos 服务发现，而是使用 config 注入的 grouplist 地址
  registry:
    type: file
  # 配置中心设为 nacos，从指定的 seata.properties 读取配置
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:a1e2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c}
      group: SEATA_GROUP
      data-id: seata.properties

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ==================== OpenFeign 兼容性配置 ====================
feign:
  sentinel:
    enabled: true

# 文件上传相关
file:
  upload-dir: /service/question-bank-service/upload/img/
  url-prefix: /img/

# JWT 配置
jwt:
  secret: YOUR_JWT_SECRET_HERE
  expiration: 86400000