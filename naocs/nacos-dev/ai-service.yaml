# =========================================================================
# ai-service.yaml (建议 Data ID: ai-service.yaml, Group: DEFAULT_GROUP)
# =========================================================================

# Redis 配置 (用于 Token 统计和生图状态追踪)
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

# 日志配置
logging:
  level:
    com.exambaby.ai: DEBUG
    org.springframework.web.reactive.function.client.WebClient: DEBUG
# JWT 配置
jwt:
  secret: YOUR_JWT_SECRET_HERE
  expiration: 86400000 #  24 小时