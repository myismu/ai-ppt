version: '3.8'

# ============================================================
# AI-PPT 业务系统编排：只包含业务自身的服务与前端
#
# 前置条件：平台（Nacos / MySQL / Redis / 统一网关 / 用户中心 /
# 文件服务）已由 cloud-platform 仓库的 docker-compose 启动，
# 本编排通过外部网络接入平台。
# ============================================================

services:
  # ==================== 前端 ====================
  ai-ppt-web:
    build:
      context: ./Web/AI-PPT
      dockerfile: Dockerfile
    container_name: ai-ppt-web
    ports:
      - "80:80"
    networks:
      - platform-network

  # ==================== 业务服务 ====================
  ppt-service:
    build:
      context: ./service/ppt-service
      dockerfile: Dockerfile
    container_name: ppt-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    networks:
      - platform-network

  ai-service:
    build:
      context: ./service/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - REDIS_HOST=redis
    networks:
      - platform-network

networks:
  # 平台编排创建的网络（compose 默认以项目名做前缀，即目录名 cloud-platform）
  # 若名称不一致，用 docker network ls 查到实际名称后修改此处
  platform-network:
    external: true
    name: cloud-platform_platform-network
