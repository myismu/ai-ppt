# ============================================================
# User Hub 用户服务 - 生产环境配置
# 说明：生产环境使用 Nacos 服务发现和 Sentinel 熔断
# 
# 启动方式：
# java -jar user-hub-service.jar --spring.profiles.active=prod -DNACOS_NAMESPACE=prod-namespace-id
# ============================================================

server:
  port: 8001
  tomcat:
    threads:
      max: 100
      min-spare: 10
      max-queue-capacity: 50

spring:
  application:
    name: user-hub-service

  cloud:
    # ==================== Nacos 配置 ====================
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.1.100:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:192.168.1.100:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

    # ==================== Sentinel 熔断降级配置 ====================
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.1.100:8858}
        port: 8719
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.1.100:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
            data-type: json
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.1.100:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
            data-type: json

  # ==================== 数据库配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:192.168.1.100}:3306/user_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.100}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-wait: 5000
          max-idle: 10
          min-idle: 5

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.exambaby.uhub.service.code.entity

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# ==================== 日志配置 ====================
logging:
  level:
    com.exambaby.uhub.service: INFO
