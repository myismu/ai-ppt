server {
    listen       80;
    server_name  localhost;

    # Docker 内置 DNS：让 proxy_pass 中的服务名在运行时解析并定期刷新。
    # 否则 nginx 只在启动时解析一次，gateway/file-service 容器重建、IP 变化后
    # 会继续连接旧 IP，表现为 502 Bad Gateway。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上传请求体上限（含文档/项目资源上传，nginx 默认 1MB 会导致 413）
    client_max_body_size 100m;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 支持 Vue History 模式
    }

    # 反向代理后端网关
    location /api {
        # 使用变量强制运行时解析；变量写法下 nginx 不会自动拼接 URI，需显式带 $request_uri
        proxy_pass http://gateway:8080$request_uri; # 对应 docker-compose 中的网关服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持 SSE 流式响应
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 300;
    }

    # 静态资源代理（由 file-service 提供或直接映射）
    location ~ ^/(templates|projects|img|image)/ {
        proxy_pass http://file-service:8003$request_uri;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
