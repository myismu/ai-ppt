server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.1.100:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:192.168.1.100:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.1.100:8858}
        port: 8718
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.1.100:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: gateway-flow-rules
            rule-type: gw-flow
            data-type: json

    gateway:
      server:
        webflux:
          routes:
            - id: user-hub-service # 用户服务
              uri: lb://user-hub-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/routes/**,/api/systemInfo/**,/api/login-history/**,/api/password-history/**,/api/redis/**
              filters:
                - StripPrefix=1

            - id: static-resources # 静态资源
              uri: lb://file-service
              predicates:
                - Path=/img/**
              filters:
                - AddResponseHeader=Cache-Control, public, max-age=86400 # 缓存一天

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.100}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-wait: 5000
          max-idle: 10
          min-idle: 5

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

logging:
  level:
    com.exambaby.gateway: INFO
    org.springframework.cloud.gateway: INFO
